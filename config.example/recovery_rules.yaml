# Cross-day recovery blocks — canonical source read by app/analytics/recovery.py
# (context_builder AND validate_plan import the same loaded constant, so the
# planner and the validator cannot disagree about a block).
#
# Each rule: an activity carrying ALL trigger_tags blocks the same stimulus
# for min_rest_days afterwards. Tags use the canonical English form ("legs");
# legacy "beine"-tagged activities still match via canonicalise_tags().
# Athlete-specific overrides: copy this file to the consumer's config/ and
# edit there — the framework copy stays generic.
rules:
  - trigger_tags: [plyo]
    min_rest_days: 3
    label: Plyo blocked
  - trigger_tags: [legs]
    min_rest_days: 2
    label: Legs/strength blocked
  - trigger_tags: [intervals]
    min_rest_days: 2
    label: Legs/Plyo blocked (post-interval)
  - trigger_tags: [ninja, upperbody]
    min_rest_days: 1
    label: Ninja upper body blocked
  - trigger_tags: [ninja, core]
    min_rest_days: 2
    label: Ninja core blocked (L-sit CNS recovery)
  # Grip → Pull-next-day is the physiological lock (forearm flexor → scapular
  # stabilisation during rowing). The tag system doesn't distinguish Pull from
  # Push — both carry `upperbody`, so Push is conservatively blocked too.
  - trigger_tags: [ninja, grip]
    min_rest_days: 2
    label: Ninja upper body blocked after Grip (forearm-flexor interference)
